name: Release APKs

on:
  release:
    types: [published]
  # Releases created through the REST API with a token do not emit a
  # `release: published` event, so tagging that way silently produces a release
  # with no APKs attached. This lets the build be run against an existing tag
  # instead of having to delete and recreate the release by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach APKs to (e.g. v0.1.384)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.value }}
      source_commit: ${{ steps.readback.outputs.source_commit }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # One source of truth for the tag: the release event supplies it on a
      # normal publish, the input supplies it on a manual re-run.
      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          if ! [[ "$TAG" =~ ^v0\.1\.[1-9][0-9]*$ ]]; then
            echo "ERROR: expected a release tag v0.1.PATCH with positive PATCH" >&2
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building $TAG"

      # Check out the TAG, not the default branch. A manual re-run must build
      # the code the tag points at, otherwise the APKs would not match the
      # release they are attached to.
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ steps.tag.outputs.value }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;34.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Download native deps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ABI in arm64-v8a x86_64; do
            gh release download native-deps --repo "$GITHUB_REPOSITORY" -p "native-deps-${ABI}.tar.gz" -O "$RUNNER_TEMP/native-deps-${ABI}.tar.gz"
            tar xzf "$RUNNER_TEMP/native-deps-${ABI}.tar.gz" -C app/src/main/cpp/
            test -f app/src/main/cpp/third_party/boost/include/boost/asio.hpp
            test -f "app/src/main/cpp/third_party/openssl/${ABI}/lib/libssl.a"
            test -f "app/src/main/cpp/third_party/aasdk/${ABI}/lib/libaasdk.a"
          done

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Retain the existing Android APK signing key only; never add MFi secrets
      # or oalCarPlayMfiAssetsDir. Credential-bearing Play builds are host-only.
      - name: Decode Android signing keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$UPLOAD_KEYSTORE_BASE64"
          umask 077
          mkdir -p secrets
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > secrets/upload-key.jks
          test -s secrets/upload-key.jks

      # Derive the version from the release tag so both APKs are stamped with a
      # real, increasing version. Without this both modules fall back to their
      # defaults (versionCode 1) and every release APK looks identical to
      # Android, making installed builds impossible to tell apart.
      #
      # versionCode is the bare PATCH component (v0.1.372 -> 372) so CI shares
      # ONE sequence with scripts/linux/bundle-release.sh, which drives Play
      # releases from secrets/version.properties. Keeping the two in a single
      # sequence means a CI-built APK could go to Play without burning a
      # version number.
      #
      # This scheme only holds while the version stays on 0.1.x: bumping to
      # 0.2.0 would produce versionCode 0 and REGRESS below the current Play
      # value. That case fails the build on purpose -- pick the new numbering
      # deliberately and update this step plus secrets/version.properties
      # together, because a versionCode bump on Play is irreversible.
      - name: Derive version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          TAG="$RELEASE_TAG"
          NAME="${TAG#v}"
          if ! [[ "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERROR: release tag '$TAG' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          if [ "${#PATCH}" -gt 10 ] || [ "$PATCH" -gt 2100000000 ]; then
            echo "ERROR: versionCode exceeds the Android/Play limit" >&2
            exit 1
          fi
          if [ "$MAJOR" != "0" ] || [ "$MINOR" != "1" ]; then
            echo "ERROR: tag '$TAG' leaves the 0.1.x line." >&2
            echo "versionCode is the bare PATCH component, so '$NAME' would" >&2
            echo "produce versionCode $PATCH and may regress below the value" >&2
            echo "already published to Play. Choose the new numbering scheme" >&2
            echo "explicitly: update this step and secrets/version.properties." >&2
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$PATCH" >> "$GITHUB_OUTPUT"
          echo "Version: name=$NAME code=$PATCH"

      - name: Build car app release APK
        env:
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -PoalVersionCode=${{ steps.version.outputs.code }} \
            -PoalVersionName=${{ steps.version.outputs.name }}

      - name: Build companion release APK
        env:
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
        run: |
          ./gradlew :companion:assembleRelease --no-daemon \
            -PoalVersionCode=${{ steps.version.outputs.code }} \
            -PoalVersionName=${{ steps.version.outputs.name }}

      - name: Rename APKs
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          TAG="$RELEASE_TAG"
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/openautolink-car-${TAG}.apk"
          mv companion/build/outputs/apk/release/companion-release.apk \
             "companion/build/outputs/apk/release/openautolink-companion-${TAG}.apk"

      # Fail closed on the exact final files attached below, including assets
      # accidentally introduced through sources, dependencies or Gradle config.
      - name: Verify public APKs contain no private CarPlay identity
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          # Unsigned builder output is not an installable public release APK.
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            "app/build/outputs/apk/release/openautolink-car-${RELEASE_TAG}.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            "companion/build/outputs/apk/release/openautolink-companion-${RELEASE_TAG}.apk"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          tag = os.environ['RELEASE_TAG']
          for module, label in (('app', 'car'), ('companion', 'companion')):
              apk = Path(f'{module}/build/outputs/apk/release/openautolink-{label}-{tag}.apk')
              with ZipFile(apk) as archive:
                  forbidden = [name for name in archive.namelist()
                               if 'offline-mfi' in name.replace('\\', '/').casefold().split('/')
                               or name.replace('\\', '/').casefold().split('/')[-1]
                               in ('identity.pk8', 'certificate.p7b')]
              if forbidden:
                  raise SystemExit(f'Private CarPlay identity found in {apk}; refusing public upload')
              print(f'Verified credential-free public APK: {apk}')
          PY

      # Freeze verified original-identity APKs OUTSIDE Gradle's output tree
      # before changing appId. Never publish outputs rebuilt with template ID.
      - name: Preserve public APKs and remove signing key before template build
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          mkdir -p public-apks
          cp "app/build/outputs/apk/release/openautolink-car-${RELEASE_TAG}.apk" public-apks/
          cp "companion/build/outputs/apk/release/openautolink-companion-${RELEASE_TAG}.apk" public-apks/
          (cd public-apks && sha256sum "openautolink-car-${RELEASE_TAG}.apk" "openautolink-companion-${RELEASE_TAG}.apk") > "$RUNNER_TEMP/public-apks.sha256"
          rm -f secrets/upload-key.jks

      - name: Build unsigned credential-free personalization AAB
        run: |
          test ! -e secrets/upload-key.jks
          ./gradlew :app:bundleRelease --no-daemon \
            -PappId=com.openautolink.template -PoalBuilderUnsigned=true \
            -PoalVersionCode=${{ steps.version.outputs.code }} \
            -PoalVersionName=${{ steps.version.outputs.name }}

      - name: Verify template and create bound descriptor
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.code }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the same release checkout, and detect a tag moved during build.
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          test "$SOURCE_COMMIT" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}"
          test "$SOURCE_COMMIT" = "$(git rev-parse 'FETCH_HEAD^{commit}')"
          gh api "repos/mossyhub/openautolink/releases/tags/${RELEASE_TAG}" \
            --jq '{tag_name, draft, prerelease}' > "$RUNNER_TEMP/template-release.json"
          python3 -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/template-release.json")); assert r["tag_name"]==os.environ["RELEASE_TAG"] and r["draft"] is False and r["prerelease"] is False'
          mkdir -p personalization-release
          cp app/build/outputs/bundle/release/app-release.aab \
            "personalization-release/openautolink-template-${RELEASE_TAG}.aab"
          # Fixed trusted verifier; never an unpinned download or signing key.
          curl --fail --location --proto '=https' --proto-redir '=https' \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool-1.18.3.jar"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 \
            "$RUNNER_TEMP/bundletool-1.18.3.jar" | sha256sum --check -
          # Stdlib-only verifier: exclude user/site packages and Python env hooks.
          python3 -I -S desktop-builder/scripts/publish_template.py \
            --aab "personalization-release/openautolink-template-${RELEASE_TAG}.aab" \
            --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" \
            --version-code "$RELEASE_VERSION_CODE" --output-dir personalization-release \
            --java "$JAVA_HOME/bin/java" --javac "$JAVA_HOME/bin/javac" \
            --bundletool "$RUNNER_TEMP/bundletool-1.18.3.jar"
          (cd personalization-release && sha256sum --check "openautolink-template-${RELEASE_TAG}.aab.sha256")
          (cd public-apks && sha256sum --check "$RUNNER_TEMP/public-apks.sha256")

      - name: Upload APKs and intentional personalization template to release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit: on workflow_dispatch there is no release in the event
          # context to infer the target from.
          tag_name: ${{ steps.tag.outputs.value }}
          fail_on_unmatched_files: true
          files: |
            public-apks/openautolink-car-${{ steps.tag.outputs.value }}.apk
            public-apks/openautolink-companion-${{ steps.tag.outputs.value }}.apk
            personalization-release/openautolink-template-${{ steps.tag.outputs.value }}.aab
            personalization-release/openautolink-personalization.json
            personalization-release/openautolink-template-${{ steps.tag.outputs.value }}.aab.sha256

      # Upload completion alone is insufficient: qualification must see exactly
      # the template, descriptor and checksum verified above, not stale assets.
      - name: Read back exact published template assets
        id: readback
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/template-readback"
          for ASSET in "openautolink-template-${RELEASE_TAG}.aab" \
                       "openautolink-personalization.json" \
                       "openautolink-template-${RELEASE_TAG}.aab.sha256"; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$ASSET" --dir "$RUNNER_TEMP/template-readback"
            cmp "personalization-release/$ASSET" "$RUNNER_TEMP/template-readback/$ASSET"
          done
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove temporary Android signing key
        if: always()
        run: rm -f secrets/upload-key.jks

  qualify-desktop-aab:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/qualify-desktop-aab.yml
    with:
      template_mode: published
      expected_release_tag: ${{ needs.build.outputs.release_tag }}
      expected_source_commit: ${{ needs.build.outputs.source_commit }}
      # Same immutable workflow source for producer and all native consumers;
      # a manual publication may target an older Android tag independently.
      builder_commit: ${{ github.sha }}
