name: Refresh website personalization template

on:
  workflow_run:
    workflows: [Publish personalization template]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One site, one upload at a time across ALL release tags and manual invocations.
# GitHub may coalesce pending runs; each survivor resolves current complete latest.
concurrency:
  group: oal-website-template-deployment
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    if: >-
      github.repository == 'mossyhub/openautolink' &&
      !github.event.repository.private &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.name == 'Publish personalization template' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'release' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      # Never check out workflow_run.head_sha or execute upstream run artifacts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test public preparation and workflow security contracts
        run: python -I -S -m unittest discover -s website-release/tests -v

  deploy:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned deployment CLI (no Azure credential available)
        run: npm install --prefix "$RUNNER_TEMP/swa-cli" --no-audit --no-fund @azure/static-web-apps-cli@2.0.10
      - name: Fetch pinned validator (no website source build)
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 \
            "$RUNNER_TEMP/bundletool.jar" | sha256sum --check -
      - name: Prepare verified public runtime and latest complete release snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -I -S website-release/refresh.py prepare --work "$RUNNER_TEMP/website-snapshot" \
            --java "$JAVA_HOME/bin/java" --javac "$JAVA_HOME/bin/javac" \
            --bundletool "$RUNNER_TEMP/bundletool.jar"
      - name: Recheck immutable proofs and prevent rollback immediately before upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -S website-release/refresh.py recheck --work "$RUNNER_TEMP/website-snapshot"
      - name: Upload exact snapshot to existing preview resource production slot
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.OAL_WEBSITE_DEPLOYMENT_TOKEN }}
          SWA_CLI_TELEMETRY: 'off'
        run: |
          test -n "$SWA_CLI_DEPLOYMENT_TOKEN"
          # Suppress vendor output: never expose deployment token or upload URLs.
          if ! "$RUNNER_TEMP/swa-cli/node_modules/.bin/swa" deploy "$RUNNER_TEMP/website-snapshot/dist" \
              --env production --no-use-keychain --app-name oal-web-preview --resource-group oal-web-preview \
              --subscription-id de1ebbeb-11f8-4375-bb7f-182f7d30c6a2 \
              > "$RUNNER_TEMP/swa-deploy-private.log" 2>&1; then
            echo 'Azure upload failed; no automatic rollback attempted' >&2
            exit 1
          fi
      - name: Verify all publicly served bytes and same-origin release metadata
        run: python -I -S website-release/refresh.py readback --work "$RUNNER_TEMP/website-snapshot"
      - name: Retain only public provenance and verified readback report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: website-refresh-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/website-snapshot/preparation.json
            ${{ runner.temp }}/website-snapshot/deployment-readback.json
          if-no-files-found: error
          retention-days: 30
