name: Publish personalization template

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing new release tag after publisher merge (v0.1.PATCH); historical tags cannot be prepared or relabeled'
        required: true
        type: string

permissions:
  contents: read

# Independent of APK shipping. Never cancel an in-flight release transaction.
concurrency:
  group: personalization-template-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  produce:
    if: ${{ !github.event.repository.private && (github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 170
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.tag.outputs.value }}
      release_id: ${{ steps.bind.outputs.release_id }}
      source_commit: ${{ steps.bind.outputs.source_commit }}
      artifact_name: ${{ format('template-publication-{0}-{1}', github.run_id, github.run_attempt) }}
    steps:
      - name: Resolve release tag and version
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v0\.1\.[1-9][0-9]{0,9}$ ]]; then
            echo 'Expected v0.1.PATCH with positive PATCH' >&2
            exit 1
          fi
          CODE="${RELEASE_TAG##*.}"
          if [ "$CODE" -gt 2100000000 ]; then
            echo 'versionCode exceeds the Android/Play limit' >&2
            exit 1
          fi
          echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.value }}
          submodules: true
          persist-credentials: false
          clean: true

      # No overlay from the workflow ref, source preparation or historical AAB.
      # v0.1.530 lacks this tree: intentionally fail before installing/building.
      - name: Preflight clean tag and required publisher tree
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          for FILE in desktop-builder/scripts/publish_template.py \
                      desktop-builder/scripts/upload_template.py \
                      desktop-builder/scripts/ci_template.py \
                      desktop-builder/oal_builder/personalize.py \
                      desktop-builder/oal_builder/releases.py \
                      desktop-builder/oal_builder/toolchain.py \
                      desktop-builder/oal_builder/resources/ProtoPersonalizer.java \
                      .github/workflows/publish-personalization-template.yml \
                      .github/workflows/qualify-desktop-aab.yml; do
            if [ ! -f "$FILE" ] || [ -L "$FILE" ]; then
              echo 'Required publisher tree absent from release tag; publish a new release after merge. Historical tags cannot be overlaid or relabeled.' >&2
              exit 1
            fi
            git cat-file -e "HEAD:$FILE"
          done
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test -z "$(git status --porcelain --untracked-files=all)"
          git submodule foreach --recursive 'test -z "$(git status --porcelain --untracked-files=all)"'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bind published release ID tag and peeled commit
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id)"
          if [[ -n "$EVENT_RELEASE_ID" ]]; then
            test "$RELEASE_ID" = "$EVENT_RELEASE_ID"
          fi
          python -I -S desktop-builder/scripts/upload_template.py --check-only \
            --release-id "$RELEASE_ID" --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;34.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Download native deps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ABI in arm64-v8a x86_64; do
            gh release download native-deps --repo "$GITHUB_REPOSITORY" -p "native-deps-${ABI}.tar.gz" -O "$RUNNER_TEMP/native-deps-${ABI}.tar.gz"
            tar xzf "$RUNNER_TEMP/native-deps-${ABI}.tar.gz" -C app/src/main/cpp/
            test -f app/src/main/cpp/third_party/boost/include/boost/asio.hpp
            test -f "app/src/main/cpp/third_party/openssl/${ABI}/lib/libssl.a"
            test -f "app/src/main/cpp/third_party/aasdk/${ABI}/lib/libaasdk.a"
          done

      - name: Build unsigned credential-free personalization AAB
        env:
          RELEASE_VERSION_CODE: ${{ steps.tag.outputs.code }}
          RELEASE_VERSION_NAME: ${{ steps.tag.outputs.name }}
        run: |
          bash ./gradlew :app:bundleRelease --no-daemon \
            -PappId=com.openautolink.template -PoalBuilderUnsigned=true \
            -PoalVersionCode="$RELEASE_VERSION_CODE" -PoalVersionName="$RELEASE_VERSION_NAME"

      - name: Verify template and create bound descriptor
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
          RELEASE_VERSION_CODE: ${{ steps.tag.outputs.code }}
          SOURCE_COMMIT: ${{ steps.bind.outputs.source_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git diff --exit-code HEAD
          mkdir -p "$RUNNER_TEMP/personalization-release"
          cp app/build/outputs/bundle/release/app-release.aab \
            "$RUNNER_TEMP/personalization-release/openautolink-template-${RELEASE_TAG}.aab"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool-1.18.3.jar"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 \
            "$RUNNER_TEMP/bundletool-1.18.3.jar" | sha256sum --check -
          python -I -S desktop-builder/scripts/publish_template.py \
            --aab "$RUNNER_TEMP/personalization-release/openautolink-template-${RELEASE_TAG}.aab" \
            --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --version-code "$RELEASE_VERSION_CODE" \
            --output-dir "$RUNNER_TEMP/personalization-release" \
            --java "$JAVA_HOME/bin/java" --javac "$JAVA_HOME/bin/javac" \
            --bundletool "$RUNNER_TEMP/bundletool-1.18.3.jar"

      - name: Share only the three verified public assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ format('template-publication-{0}-{1}', github.run_id, github.run_attempt) }}
          path: |
            ${{ runner.temp }}/personalization-release/openautolink-template-${{ steps.tag.outputs.value }}.aab
            ${{ runner.temp }}/personalization-release/openautolink-template-${{ steps.tag.outputs.value }}.aab.sha256
            ${{ runner.temp }}/personalization-release/openautolink-personalization.json
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 7

  upload:
    needs: produce
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.produce.outputs.source_commit }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.produce.outputs.artifact_name }}
          path: ${{ runner.temp }}/personalization-release
      - name: Upload template only and read back exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.produce.outputs.release_id }}
          RELEASE_TAG: ${{ needs.produce.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.produce.outputs.source_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=all)"
          python -I -S desktop-builder/scripts/upload_template.py \
            --directory "$RUNNER_TEMP/personalization-release" \
            --release-id "$RELEASE_ID" --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"

  qualify-desktop-aab:
    needs: [produce, upload]
    permissions:
      contents: read
    uses: ./.github/workflows/qualify-desktop-aab.yml
    with:
      template_mode: published
      expected_release_tag: ${{ needs.produce.outputs.release_tag }}
      expected_source_commit: ${{ needs.produce.outputs.source_commit }}
      builder_commit: ${{ needs.produce.outputs.source_commit }}
# Qualification is downstream of verified publication, never a racing release
# event, recursive dispatch, source fallback or dependency of signed APK shipping.
