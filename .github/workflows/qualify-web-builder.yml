name: Qualify web builder (core; opt-in Chromium)

on:
  pull_request:
    paths:
      - 'web-builder/**'
      - '.github/workflows/qualify-web-builder.yml'
  push:
    branches: ['feat/**']
    paths:
      - 'web-builder/**'
      - '.github/workflows/qualify-web-builder.yml'
  workflow_dispatch:
    inputs:
      local_template_chromium:
        description: 'Run local-template Chromium gates (also runs full desktop qualification and accepts CI Android licenses)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: qualify-web-builder-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILDER_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  core:
    name: Node 22 core and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15-intel, macos-15]
    defaults:
      run:
        working-directory: web-builder
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; existing repository pin
        with:
          ref: ${{ env.BUILDER_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Bind checkout and create native scratch paths
        shell: python {0}
        run: |
          import os, pathlib, subprocess, sys, tempfile
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == os.environ['BUILDER_COMMIT'], 'Checkout commit mismatch'
          root = pathlib.Path(tempfile.mkdtemp(prefix='oal-web-core-', dir=os.environ['RUNNER_TEMP'])).resolve()
          assert not root.is_relative_to(pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve())
          values = {'TMPDIR': str(root), 'TMP': str(root), 'TEMP': str(root),
                    'CARPLAY_FIXTURE_PYTHON': sys.executable,
                    'OAL_UI_TEST': '0', 'OAL_WEB_QUALIFY': '0',
                    'OAL_WEB_TEMPLATE': '', 'OAL_WEB_TOOLS': '',
                    'OAL_MIRROR_LOCAL_TEMPLATE': '', 'OAL_MIRROR_LOCAL_DESCRIPTOR': ''}
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
      - name: Install pinned synthetic-fixture dependency
        run: python -m pip install --disable-pip-version-check cryptography==44.0.3
      - name: Install exact locked Node dependencies
        run: npm ci --no-audit --no-fund
      # Browser and real-template cases are intentionally disabled here. This
      # check is not browser/AAB qualification; the opt-in job below is separate.
      - name: Node core and synthetic-fixture tests (not browser qualification)
        run: node --test tests/*.test.mjs
      - name: Build production assets into scratch (no deployment)
        run: npm run build -- --outDir "$TMPDIR/dist"

  # The existing workflow_call API is a WHOLE desktop qualification workflow,
  # not a template-only job. Keep it unchanged; opt in explicitly to its cost.
  # No arbitrary run ID, URL, branch, retained fixture or empty AAB is accepted.
  local-template:
    name: Opt-in existing desktop workflow and exact local template
    if: github.event_name == 'workflow_dispatch' && inputs.local_template_chromium
    needs: core
    uses: ./.github/workflows/qualify-desktop-aab.yml
    with:
      template_mode: local
      expected_release_tag: ''
      expected_source_commit: ''
      builder_commit: ${{ github.sha }}

  chromium-ui:
    name: Local-template Chromium UI (${{ matrix.os }})
    needs: [core, local-template]
    if: github.event_name == 'workflow_dispatch' && inputs.local_template_chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15-intel, macos-15]
    defaults:
      run:
        working-directory: web-builder
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; existing repository pin
        with:
          ref: ${{ env.BUILDER_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Bind checkout and create private native scratch paths
        shell: python {0}
        run: |
          import os, pathlib, subprocess, sys, tempfile
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == os.environ['BUILDER_COMMIT'], 'Checkout commit mismatch'
          root = pathlib.Path(tempfile.mkdtemp(prefix='oal-web-ui-', dir=os.environ['RUNNER_TEMP'])).resolve()
          assert not root.is_relative_to(pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve())
          values = {'TMPDIR': str(root), 'TMP': str(root), 'TEMP': str(root),
                    'CARPLAY_FIXTURE_PYTHON': sys.executable, 'OAL_UI_TEST': '1',
                    'OAL_UI_OUTPUT': str(root / 'private-ui-output'),
                    'OAL_UI_DIST': str(root / 'dist'),
                    'OAL_TEMPLATE_INPUTS': str(root / 'template-inputs'),
                    'OAL_WEB_TEMPLATE': str(root / 'template-inputs' / 'template.aab'),
                    'OAL_WEB_DESCRIPTOR': str(root / 'template-inputs' / 'openautolink-personalization.json'),
                    'PLAYWRIGHT_BROWSERS_PATH': str(root / 'browsers'), 'OAL_BROWSER': ''}
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in values.items():
                  output.write(f'{key}={value}\n')
      - name: Install pinned fixture and template-verifier dependency
        run: python -m pip install --disable-pip-version-check cryptography==44.0.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # Same workflow run only, exported by the unchanged reusable API.
          name: native-template-inputs
          path: ${{ env.OAL_TEMPLATE_INPUTS }}
      - name: Revalidate exact template bytes and immutable source binding
        working-directory: desktop-builder
        shell: python {0}
        run: |
          import os, sys
          # GitHub's python shell executes a temporary script, not a module.
          sys.path.insert(0, os.getcwd())
          from scripts.ci_template import load_inputs
          value = load_inputs(os.environ['OAL_TEMPLATE_INPUTS'])
          assert value['provenance'] == 'local-linux-template', 'Wrong template qualification mode'
          source = value['release']
          print('LOCAL template source:', source['sourceRef'], source['sourceCommit'])
          print('Reviewed source preparation:', ','.join(value['sourcePreparation']) or 'none')
      - name: Install exact locked Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Install locked Playwright Chromium and Linux runtime libraries
        if: runner.os == 'Linux'
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Install locked Playwright Chromium on native Windows or macOS
        if: runner.os != 'Linux'
        run: node node_modules/playwright/cli.js install chromium
      - name: Build production assets into scratch
        run: npm run build -- --outDir "$OAL_UI_DIST"
      - name: Exercise built wizard in Chromium; reject any skipped UI tests
        shell: python {0}
        run: |
          import functools, http.server, json, os, pathlib, re, subprocess, threading
          assert os.environ['OAL_UI_TEST'] == '1'
          dist = pathlib.Path(os.environ['OAL_UI_DIST'])
          assert (dist / 'index.html').is_file(), 'Missing production build'
          headers = json.loads((dist / 'staticwebapp.config.json').read_text('utf-8'))['globalHeaders']
          class Handler(http.server.SimpleHTTPRequestHandler):
              def end_headers(self):
                  for key, value in headers.items():
                      self.send_header(key, value)
                  super().end_headers()
              def log_message(self, *args):
                  pass
          server = http.server.ThreadingHTTPServer(('127.0.0.1', 0), functools.partial(Handler, directory=str(dist)))
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()
          env = dict(os.environ, OAL_UI_ORIGIN=f'http://127.0.0.1:{server.server_port}')
          # Tests produce disposable encrypted backups, synthetic private pairs,
          # AABs and form screenshots. Keep all of them AND raw diagnostics local.
          log = pathlib.Path(os.environ['TMPDIR']) / 'private-ui.tap'
          try:
              with log.open('w', encoding='utf-8') as output:
                  result = subprocess.run(['node', '--test', '--test-reporter=tap',
                                           'tests/ui-flow.test.mjs', 'tests/ui-state.test.mjs'],
                                          env=env, stdout=output, stderr=subprocess.STDOUT, timeout=1500)
              text = log.read_text('utf-8')
              counts = {key: int(value) for key, value in re.findall(
                  r'^# (tests|pass|fail|cancelled|skipped|todo) (\d+)\s*$', text, re.MULTILINE)}
              print('Chromium UI summary:', json.dumps(counts, sort_keys=True))
              assert result.returncode == 0, 'Chromium UI failed; raw private diagnostics are not exported'
              assert set(counts) == {'tests', 'pass', 'fail', 'cancelled', 'skipped', 'todo'}, 'Missing test summary'
              assert counts['tests'] > 0 and counts['pass'] == counts['tests'], 'UI tests did not all pass'
              assert all(counts[key] == 0 for key in ('fail', 'cancelled', 'skipped', 'todo')), 'Incomplete UI qualification'
          finally:
              server.shutdown()
              server.server_close()
              thread.join(timeout=5)
      # Deliberately NO upload-artifact, Pages, deployment, release or publishing
      # step here. Never upload the scratch tree, screenshots, logs or backups.
